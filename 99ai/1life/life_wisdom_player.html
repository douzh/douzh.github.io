<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生命·智慧·硅基生命进化 — 1分钟短片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #player-container {
    position: relative;
    width: 960px;
    max-width: 100vw;
  }
  video {
    width: 100%;
    display: block;
    border-radius: 4px;
  }
  #info-overlay {
    position: absolute;
    bottom: 60px;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  #chapter-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(0,240,255,0.6), 0 0 40px rgba(0,240,255,0.3);
    transition: opacity 0.5s;
  }
  #chapter-subtitle {
    font-size: 14px;
    margin-top: 8px;
    opacity: 0.7;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(0,240,255,0.3);
    transition: opacity 0.5s;
  }
  #progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, #00F0FF, #FF2E93);
    transition: width 0.1s linear;
    z-index: 11;
  }
  #controls {
    margin-top: 20px;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  button {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  button:hover {
    background: rgba(0,240,255,0.15);
    border-color: rgba(0,240,255,0.4);
  }
  #time-display {
    font-size: 13px;
    opacity: 0.6;
    font-variant-numeric: tabular-nums;
  }
  #title-bar {
    text-align: center;
    margin-bottom: 20px;
  }
  #title-bar h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #00F0FF, #FF2E93);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
</style>
</head>
<body>

<div id="title-bar">
  <h1>生命 · 智慧 · 硅基生命进化</h1>
</div>

<div id="player-container">
  <video id="video" playsinline autoplay muted></video>
  <div id="progress-bar" style="width: 0%"></div>
  <div id="info-overlay">
    <div id="chapter-title"></div>
    <div id="chapter-subtitle"></div>
  </div>
</div>

<div id="controls">
  <button id="play-btn" onclick="togglePlay()">⏯ 播放/暂停</button>
  <button id="restart-btn" onclick="restart()">⟳ 重新开始</button>
  <span id="time-display">00:00 / 01:00</span>
</div>

<script>
const chapters = [
  { title: '生  命', subtitle: '信息编码 · 自我维持 · 自我延续', color: '#4488FF' },
  { title: '智  慧', subtitle: '感知 → 建模 → 决策 → 学习闭环', color: '#FFAA00' },
  { title: '智慧生命', subtitle: '生命 ∩ 智慧 的交汇融合', color: '#AA66FF' },
  { title: '智慧生命进化', subtitle: '载体演化 · 模型延伸 · 双路径并行', color: '#FF6644' },
  { title: '硅基生命进化', subtitle: '工具 → 准生命 → 成熟 → 自主文明', color: '#00F0FF' },
];

const clips = [
  'clip_1_life_slow.mp4',
  'clip_2_wisdom_slow.mp4',
  'clip_3_intelligent_life_slow.mp4',
  'clip_4_evolution_slow.mp4',
  'clip_5_silicon_slow.mp4',
];

const TOTAL_DURATION = 60; // approximate total seconds
let currentClip = 0;
let totalElapsed = 0;
let isPlaying = false;
let animationId = null;

const video = document.getElementById('video');
const chapterTitle = document.getElementById('chapter-title');
const chapterSub = document.getElementById('chapter-subtitle');
const progressBar = document.getElementById('progress-bar');
const timeDisplay = document.getElementById('time-display');

video.addEventListener('ended', () => {
  totalElapsed += video.duration || 12;
  currentClip++;
  if (currentClip < clips.length) {
    video.src = clips[currentClip];
    video.load();
    video.play().catch(e => console.log('autoplay blocked'));
    updateChapter();
  } else {
    isPlaying = false;
    cancelAnimationFrame(animationId);
    updateChapter();
    chapterTitle.textContent = '碳硅混合文明';
    chapterSub.textContent = '共生 · 平等 · 超越 · 永恒';
    progressBar.style.width = '100%';
    timeDisplay.textContent = '01:00 / 01:00';
  }
});

video.addEventListener('timeupdate', () => {
  const clipElapsed = video.currentTime || 0;
  const clipDuration = video.duration || 12;
  const currentTotal = totalElapsed + clipElapsed;
  const progress = Math.min((currentTotal / TOTAL_DURATION) * 100, 100);
  progressBar.style.width = progress + '%';

  const mins = Math.floor(currentTotal / 60);
  const secs = Math.floor(currentTotal % 60);
  timeDisplay.textContent =
    String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + ' / 01:00';
});

function updateChapter() {
  if (currentClip < chapters.length) {
    const ch = chapters[currentClip];
    chapterTitle.textContent = ch.title;
    chapterSub.textContent = ch.subtitle;
    chapterTitle.style.textShadow = `0 0 20px ${ch.color}88, 0 0 40px ${ch.color}44`;
  }
}

function togglePlay() {
  if (video.paused) {
    video.play().catch(() => {});
  } else {
    video.pause();
  }
}

function restart() {
  currentClip = 0;
  totalElapsed = 0;
  video.src = clips[0];
  video.load();
  video.play().catch(() => {});
  updateChapter();
  progressBar.style.width = '0%';
  timeDisplay.textContent = '00:00 / 01:00';
}

// Initialize
video.src = clips[0];
updateChapter();
video.load();
video.play().catch(() => {});
timeDisplay.textContent = '00:00 / 01:00';
</script>
</body>
</html>
